<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Início — Turma da Aventura</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="ds/tda/components/bundle.css">
<link rel="stylesheet" href="styles/site.css">
<script src="ds/tda/components/bundle.js"></script>
<script src="styles/tda-assets.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&amp;family=Nunito:ital,wght@0,200..1000;1,200..1000&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="page" data-page="Inicio" style="font-family: var(--font-body); color: var(--ink); width: 100%;">

  <!-- Inicio/Header -->
  <x-import component-from-global-scope="TDA.Header" items="{{nav}}" current="/" message="Olá! Vim pelo site e quero um orçamento."></x-import>

  <!-- Inicio/Hero -->
  <x-import component-from-global-scope="TDA.Hero" overline="Recreação infantil" title="Bora pra aventura?" lead="A gente leva brincadeiras, oficinas e gincanas para festas, restaurantes, empresas e escolas. Monitores treinados, atividades por idade e muita natureza — você só curte." image-alt="Crianças de costas correndo num gramado ao fim da tarde, com monitores por perto" message="Olá! Vim pelo site e quero um orçamento." secondary="{{secondary}}" highlights="{{highlights}}"></x-import>

  <!-- Inicio/QuatroJeitos -->
  <section class="sec sec--sunken" data-section="Inicio/QuatroJeitos">
    <div class="wrap">
      <x-import component-from-global-scope="TDA.SectionHeader" overline="Onde a Turma aparece" title="Quatro jeitos de viver a aventura" description="Escolha o seu ponto de partida. Em todos eles, quem cuida das crianças é a nossa equipe."></x-import>
      <div class="g4">
        <x-import component-from-global-scope="TDA.ServiceCard" icon="star" overline="Para aniversários" title="Festas e aniversários" description="Uma aventura temática na festa do seu filho, em casa, no prédio ou no buffet." href="SiteFestas.dc.html" link-label="Ver festas"></x-import>
        <x-import component-from-global-scope="TDA.ServiceCard" icon="utensils" overline="Para famílias" title="Restaurantes" description="Recreação fixa nos fins de semana. As crianças brincam por perto e você come com calma." href="SiteRestaurantes.dc.html" link-label="Ver restaurantes"></x-import>
        <x-import component-from-global-scope="TDA.ServiceCard" icon="briefcase" tone="earth" overline="Para empresas" title="Eventos corporativos" description="Espaço kids em confraternizações, Dia da Família, convenções e férias na empresa." href="SiteEventos.dc.html" link-label="Ver eventos corporativos"></x-import>
        <x-import component-from-global-scope="TDA.ServiceCard" icon="scissors" overline="Para escolas e grupos" title="Oficinas" description="Pipas, mini horta, tintas naturais e gincanas. Atividades manuais e de natureza." href="SiteOficina.dc.html" link-label="Conhecer as Oficinas"></x-import>
      </div>
    </div>
  </section>

  <!-- Inicio/Pilares -->
  <section class="sec" data-section="Inicio/Pilares">
    <div class="wrap">
      <x-import component-from-global-scope="TDA.SectionHeader" align="center" overline="Nosso jeito" title="Brincar / Aprender / Ensinar"></x-import>
      <div class="g3">
        <x-import component-from-global-scope="TDA.ValuePillar" icon="compass" tone="brand" number="01" title="Brincar" text="Brincadeira livre e dirigida, ao ar livre sempre que dá. Criança precisa correr, sujar a mão e rir alto."></x-import>
        <x-import component-from-global-scope="TDA.ValuePillar" icon="leaf" tone="olive" number="02" title="Aprender" text="Cada atividade traz uma descoberta: sobre a natureza, sobre o grupo e sobre si mesmo."></x-import>
        <x-import component-from-global-scope="TDA.ValuePillar" icon="heart" tone="earth" number="03" title="Ensinar" text="As crianças ensinam umas às outras — e a gente aprende junto com elas."></x-import>
      </div>
    </div>
  </section>

  <!-- Inicio/ComoFunciona -->
  <section class="sec sec--sunken" data-section="Inicio/ComoFunciona">
    <div class="wrap">
      <x-import component-from-global-scope="TDA.SectionHeader" overline="Como funciona" title="Do “oi” à aventura em três etapas"></x-import>
      <x-import component-from-global-scope="TDA.Trail" steps="{{steps}}"></x-import>
    </div>
  </section>

  <!-- Inicio/OndeEsta -->
  <section class="sec" data-section="Inicio/OndeEsta">
    <div class="wrap">
      <div class="head-row">
        <x-import component-from-global-scope="TDA.SectionHeader" overline="Fim de semana com a Turma" title="Onde a Turma está" description="Restaurantes parceiros com recreação fixa. Chegue, peça seu prato e deixe a aventura com a gente."></x-import>
        <a class="link-more" href="SiteRestaurantes.dc.html">Ver todos os restaurantes
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
        </a>
      </div>
      <div class="g3">
        <x-import component-from-global-scope="TDA.RestaurantCard" name="Cantina do Bosque" neighborhood="Savassi" schedule="Sáb e dom, 12h às 17h" address="Rua das Acácias, 000" ages="De 3 a 10 anos" maps-url="#" placeholder-id="r1" image-alt="Área kids do restaurante com mesas baixas e cabana de tecido"></x-import>
        <x-import component-from-global-scope="TDA.RestaurantCard" name="Brasa &amp; Lenha" neighborhood="Belvedere" schedule="Sáb e dom, 12h às 16h" address="Alameda dos Ipês, 000" ages="De 3 a 12 anos" maps-url="#" placeholder-id="r2" image-alt="Crianças em roda no jardim do restaurante"></x-import>
        <x-import component-from-global-scope="TDA.RestaurantCard" name="Rancho Cedro" neighborhood="Pampulha" schedule="Sáb, dom e feriados, 11h às 17h" address="Rua do Cedro, 000" ages="De 3 a 12 anos" maps-url="#" placeholder-id="r3" image-alt="Gramado com circuito de cordas entre árvores"></x-import>
      </div>
    </div>
  </section>

  <!-- Inicio/Galeria -->
  <section class="sec sec--sunken" data-section="Inicio/Galeria">
    <div class="wrap">
      <x-import component-from-global-scope="TDA.SectionHeader" overline="Diário de expedição" title="Um pouco do que rola por aqui"></x-import>
      <div class="gallery">
        <div class="ga"><x-import component-from-global-scope="TDA.Media" alt="Crianças de costas empinando pipas num gramado" icon="flag" placeholder-id="g1"></x-import></div>
        <div class="gb"><x-import component-from-global-scope="TDA.Media" alt="Mãos pintando papel com tinta de urucum" icon="palette" placeholder-id="g2"></x-import></div>
        <div class="gc"><x-import component-from-global-scope="TDA.Media" alt="Grupo de crianças montando cabana com galhos" icon="tent" placeholder-id="g3"></x-import></div>
        <div class="gd"><x-import component-from-global-scope="TDA.Media" alt="Monitora mostrando um mapa do tesouro para o grupo" icon="compass" placeholder-id="g4"></x-import></div>
        <div class="ge"><x-import component-from-global-scope="TDA.Media" alt="Crianças plantando mudas na mini horta" icon="leaf" placeholder-id="g5"></x-import></div>
        <div class="gf"><x-import component-from-global-scope="TDA.Media" alt="Circuito de aventura com cordas entre árvores" icon="tree" placeholder-id="g6"></x-import></div>
      </div>
    </div>
  </section>

  <!-- Inicio/CTA -->
  <section class="sec" data-section="Inicio/CTA">
    <div class="wrap">
      <x-import component-from-global-scope="TDA.CTABanner" title="Bora planejar a próxima aventura?" text="Conta pra gente o que você imagina. A gente monta a proposta e responde rapidinho." cta-label="Pedir orçamento no WhatsApp" message="Olá! Vim pelo site e quero um orçamento."></x-import>
    </div>
  </section>

  <!-- Inicio/Footer -->
  <x-import component-from-global-scope="TDA.Footer" items="{{footNav}}" about="{{about}}" instagram="@turmadaaventura" city="Belo Horizonte · MG" year="{{year}}"></x-import>

  <!-- WhatsAppFloat (fixo em todas as páginas; aqui ancorado na 1ª dobra) -->
  <div class="wa-pin"><x-import component-from-global-scope="TDA.WhatsAppFloat" inline="{{yes}}" label="Fale com a gente" message="Olá! Vim pelo site e quero saber mais."></x-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":5700}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true,
      year: 2026,
      nav: [
        { label: 'Início', href: '/' }, { label: 'Oficinas', href: '/oficinas' }, { label: 'Festas', href: '/festas-e-aniversarios' },
        { label: 'Restaurantes', href: '/restaurantes' }, { label: 'Eventos corporativos', href: '/eventos-corporativos' }, { label: 'Quem somos', href: '/quem-somos' }
      ],
      footNav: [
        { label: 'Início', href: '/' }, { label: 'Oficinas', href: '/oficinas' }, { label: 'Festas e aniversários', href: '/festas-e-aniversarios' },
        { label: 'Restaurantes', href: '/restaurantes' }, { label: 'Eventos corporativos', href: '/eventos-corporativos' }, { label: 'Quem somos', href: '/quem-somos' }
      ],
      about: 'Recreação infantil para festas, restaurantes, eventos corporativos e oficinas em Belo Horizonte. Monitores treinados, brincadeiras ao ar livre e muita imaginação.',
      secondary: { label: 'Conhecer as Oficinas', href: 'SiteOficina.dc.html' },
      highlights: ['Monitores treinados', 'Atividades por faixa etária', 'Montamos tudo no local'],
      steps: [
        { icon: 'whatsapp', title: 'Chama no WhatsApp', text: 'Conta o tipo de evento, a data e quantas crianças. Respondemos em horário comercial.' },
        { icon: 'compass', title: 'Montamos a expedição', text: 'Atividades, materiais e equipe sob medida para o seu espaço e para a idade da turma.' },
        { icon: 'tent', title: 'A aventura começa', text: 'Chegamos antes, montamos tudo e cuidamos das crianças do começo ao fim.' }
      ]
    };
  }
}
</script>
</body>
</html>
